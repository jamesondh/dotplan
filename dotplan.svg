<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="dotplan banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2442" stroke-opacity="0.30" stroke-width="1"/>
    </pattern>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="0.55" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#B18CFF"/>
    </linearGradient>

    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A355E" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#2A355E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2A355E" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.45"/>

  <!-- Left "terminal" card -->
  <g filter="url(#cardShadow)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace">
    <rect x="70" y="95" width="520" height="440" rx="18" fill="#0A1126" stroke="#1D2A52" stroke-width="2"/>

    <!-- Toolbar -->
    <rect x="70" y="95" width="520" height="64" rx="18" fill="#0C1633"/>
    <path d="M70 159 H590" stroke="#2A355E" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <g transform="translate(92 127)">
      <circle r="7" cx="0" cy="0" fill="#FF5F57"/>
      <circle r="7" cx="22" cy="0" fill="#FEBB2E"/>
      <circle r="7" cx="44" cy="0" fill="#28C840"/>
    </g>

    <!-- cat AGENTS.md -->
    <text x="92" y="198" font-size="16" fill="#9AA7C7">~/repo</text>
    <text x="160" y="198" font-size="16" fill="#7CFFB2">$</text>
    <text x="178" y="198" font-size="16" fill="#D8E1FF"> cat AGENTS.md</text>

    <!-- Highlight row for Rules -->
    <rect x="86" y="296" width="488" height="34" rx="9" fill="#0F1B3D" opacity="0.62"/>
    <rect x="86" y="296" width="4" height="34" rx="2" fill="#58A6FF" opacity="0.95"/>

    <text x="104" y="243" font-size="18" fill="#D8E1FF"><tspan fill="#58A6FF">##</tspan> Working here</text>
    <text x="314" y="243" font-size="16" fill="#9AA7C7">seven rules, every repo</text>

    <text x="104" y="281" font-size="18" fill="#D8E1FF"><tspan fill="#58A6FF">##</tspan> Map</text>
    <text x="314" y="281" font-size="16" fill="#9AA7C7">where things are</text>

    <text x="104" y="319" font-size="18" fill="#D8E1FF"><tspan fill="#58A6FF">##</tspan> Rules</text>
    <text x="314" y="319" font-size="16" fill="#9AA7C7">what breaks silently</text>

    <text x="104" y="357" font-size="18" fill="#D8E1FF"><tspan fill="#58A6FF">##</tspan> Checks</text>
    <text x="314" y="357" font-size="16" fill="#9AA7C7">what to run, by path</text>

    <!-- git log -->
    <text x="92" y="410" font-size="16" fill="#9AA7C7">~/repo</text>
    <text x="160" y="410" font-size="16" fill="#7CFFB2">$</text>
    <text x="178" y="410" font-size="16" fill="#D8E1FF"> git log --oneline</text>

    <text x="104" y="448" font-size="15" fill="#FEBB2E">a1c3e9f</text>
    <text x="184" y="448" font-size="15" fill="#D8E1FF">Sessions: renew before clock skew</text>
    <text x="104" y="478" font-size="15" fill="#FEBB2E" opacity="0.7">7d0b42e</text>
    <text x="184" y="478" font-size="15" fill="#9AA7C7">Backups: list new tables in manifest</text>
    <text x="104" y="508" font-size="15" fill="#FEBB2E" opacity="0.45">e58f1a6</text>
    <text x="184" y="508" font-size="15" fill="#9AA7C7" opacity="0.6">Protocol: take a version past both</text>
  </g>

  <!-- Divider -->
  <rect x="625" y="120" width="3" height="410" fill="url(#divider)"/>

  <!-- Right side -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace">
    <text x="680" y="250" font-size="88" font-weight="800" letter-spacing="-1.2" fill="url(#accent)">dotplan</text>

    <g transform="translate(1062 178)">
      <rect x="0" y="0" width="54" height="30" rx="9" fill="#0A1126" stroke="#B18CFF" stroke-opacity="0.55" stroke-width="2"/>
      <text x="27" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#E3D6FF">v2</text>
    </g>

    <text x="680" y="330" font-size="28" font-weight="650" fill="#D8E1FF">one AGENTS.md, no ceremony</text>

    <text x="680" y="370" font-size="16" fill="#9AA7C7">rules, checks, and commits that say why</text>

    <!-- Badges -->
    <g transform="translate(680 420)">
      <g>
        <rect x="0" y="0" width="130" height="34" rx="10" fill="#0A1126" stroke="#2A355E" stroke-width="2"/>
        <rect x="0" y="0" width="130" height="34" rx="10" fill="#7CFFB2" opacity="0.08"/>
        <text x="65" y="23" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.2" fill="#BFFFD9">git-native</text>
      </g>

      <g transform="translate(150 0)">
        <rect x="0" y="0" width="170" height="34" rx="10" fill="#0A1126" stroke="#2A355E" stroke-width="2"/>
        <rect x="0" y="0" width="170" height="34" rx="10" fill="#58A6FF" opacity="0.10"/>
        <text x="85" y="23" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.2" fill="#BFD9FF">agent-agnostic</text>
      </g>

      <g transform="translate(340 0)">
        <rect x="0" y="0" width="132" height="34" rx="10" fill="#0A1126" stroke="#2A355E" stroke-width="2"/>
        <rect x="0" y="0" width="132" height="34" rx="10" fill="#B18CFF" opacity="0.10"/>
        <text x="66" y="23" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.2" fill="#E3D6FF">zero install</text>
      </g>
    </g>
  </g>
</svg>
